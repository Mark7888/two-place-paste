// Pairing an additional device into an existing group (SPEC §3.2, ROADMAP P1).
//
// Pairing is symmetric: desktop->mobile, mobile->desktop and desktop->desktop
// run the identical exchange. Only the transport of PairingPayload differs
// (QR code or copy-pasted string).
syntax = "proto3";

package tpp.v1;

option go_package = "github.com/Mark7888/two-place-paste/pkg/tppclient/protogen/tppv1;tppv1";

// PairingPayload is what the inviter displays and the joiner scans or pastes
// (SPEC §3.2, "Payload contents").
//
// It never travels over the WebSocket. It is defined here because both client
// implementations must encode it identically or a phone will not be able to
// read a desktop's QR code; the serialized bytes are base64url-encoded
// (unpadded) to form the scannable and copyable string.
message PairingPayload {
  // Base URL of the relay, e.g. "https://tpp.example.com".
  string server_url = 1;

  // Short-lived, single-use token from PairingStartResponse.
  string pairing_token = 2;

  // The inviter's ephemeral public key, generated for this pairing attempt and
  // discarded afterwards. It binds the joiner's public key to this out-of-band
  // channel so that the relay cannot substitute a key of its own; how it is
  // used is pinned by /spec/crypto.md (ROADMAP P2), not here.
  bytes inviter_ephemeral_public_key = 3;
}

// PairingStartRequest asks the server to mint a pairing token (SPEC §3.2
// step 1). Sent by an already-paired device over its authenticated connection;
// the group is taken from that connection, so the message has no fields.
message PairingStartRequest {}

// PairingStartResponse returns the registered token. The inviter combines it
// with its server URL and ephemeral public key into a PairingPayload.
message PairingStartResponse {
  string pairing_token = 1;

  // Milliseconds since the Unix epoch, UTC. Suggested lifetime is 5 minutes
  // (SPEC §3.2); the server is the authority, and the client shows the
  // countdown from this value rather than assuming the duration.
  int64 expires_at_unix_ms = 2;
}

// PairingJoinRequest is the joiner presenting itself (SPEC §3.2 step 2). It is
// sent on an unauthenticated connection: the pairing token is the only
// credential the joiner has at this point.
message PairingJoinRequest {
  string pairing_token = 1;

  // Human-chosen name for the joining device.
  string device_name = 2;

  // The joiner's freshly generated device public key.
  bytes device_public_key = 3;
}

// PairingJoinNotice is pushed to the inviter over its open WebSocket
// (SPEC §3.2 step 3) so it can wrap the current group key for the joiner.
message PairingJoinNotice {
  string pairing_token = 1;

  // Identifier the server assigned to the joining device.
  string device_id = 2;
  string device_name = 3;

  // Echoed from PairingJoinRequest. The inviter wraps to this key.
  bytes device_public_key = 4;
}

// PairingWrappedKeyUpload delivers the wrapped group key from the inviter
// (SPEC §3.2 step 4). The server relays it and cannot unwrap it.
message PairingWrappedKeyUpload {
  string pairing_token = 1;
  string device_id = 2;

  // The current group key wrapped to the joiner's public key.
  bytes wrapped_group_key = 3;
}

// PairingComplete is pushed to the joiner once the relay holds its wrapped key.
// The joiner is now a member at the group's current epoch.
//
// A newly paired device starts empty: it cannot decrypt anything created before
// it joined and must not request history for that period (SPEC §3.2).
message PairingComplete {
  string group_id = 1;
  string device_id = 2;
  uint64 epoch = 3;
  bytes wrapped_group_key = 4;
}

// ---------------------------------------------------------------------------
// Joiner-emitted pairing (docs/plans/joiner-emitted-pairing.md)
//
// The mirror image of the flow above: the device that holds no group key mints
// the code, and a member consumes it. Everything below exists because a joiner
// cannot mint a PairingStartResponse — that takes an authenticated connection —
// so the relay has to be able to hold what an unpaired device wants to show.
//
// The wrap itself is unchanged (/spec/crypto.md §4.2) and PairingComplete is
// reused verbatim: only the direction the out-of-band code travels differs.
// ---------------------------------------------------------------------------

// PairingOffer is what an unpaired device displays and a member scans or
// pastes. It is the joiner-emitted counterpart of PairingPayload and, like it,
// never travels over the WebSocket.
//
// It carries the joiner's *device* public key rather than an ephemeral one:
// that key is what the member wraps the group key to, and the relay refuses an
// accept whose key does not match the stored offer byte for byte. A relay that
// substituted a key of its own would have to make it match an offer it did not
// create, which is what keeps the relay outside the trust path in this
// direction too.
message PairingOffer {
  // Base URL of the relay holding this offer, e.g. "https://tpp.example.com".
  //
  // An unpaired device has no relay URL of its own, so the user supplies it
  // once on the joining device; the code carries it so the member does not
  // have to type it as well.
  string server_url = 1;

  // Short-lived, single-use code from PairingOfferResponse.
  string offer_code = 2;

  // The joining device's public key. The member wraps the group key to this
  // key, read out of band, and never to one the relay supplied.
  bytes device_public_key = 3;

  // Human-chosen name for the joining device, so the member's confirmation
  // dialog can name what it is about to admit. It is display text from an
  // untrusted source: the fingerprint of device_public_key is what actually
  // identifies the device.
  string device_name = 4;
}

// PairingCode is the discriminated union of everything a scan or a paste may
// carry. It exists because protobuf decodes by field number, not by name: a
// bare PairingOffer decodes as a PairingPayload without error, so a second kind
// of code needs an explicit discriminator rather than a second bare message.
//
// Clients decode PairingCode first and fall back to a bare PairingPayload, so
// a code shown by a build that predates this message still pairs.
message PairingCode {
  oneof code {
    // Member-emitted, as before.
    PairingPayload invite = 1;

    // Joiner-emitted.
    PairingOffer offer = 2;
  }
}

// PairingOfferRequest asks the relay to hold an offer for a device that has no
// group key yet. It is sent on an unauthenticated connection — the joiner has
// no credential at this point, which is the whole reason this message exists.
//
// The joiner keeps the socket open afterwards, exactly as PairingJoinRequest
// does: PairingComplete is pushed to it once a member accepts.
message PairingOfferRequest {
  // Human-chosen name for the joining device, shown in the member's
  // confirmation dialog.
  string device_name = 1;

  // The joiner's device public key. The relay stores it and later refuses any
  // accept whose key is not byte-for-byte identical.
  bytes device_public_key = 2;
}

// PairingOfferResponse returns the registered offer. The joiner combines it
// with its server URL and public key into a PairingOffer.
message PairingOfferResponse {
  string offer_code = 1;

  // Milliseconds since the Unix epoch, UTC. The lifetime matches the 5 minutes
  // of SPEC §3.2; the server is the authority and the client shows the
  // countdown from this value rather than assuming the duration.
  int64 expires_at_unix_ms = 2;
}

// PairingOfferAcceptRequest is a member admitting the offered device into its
// group. It is legal only on an authenticated connection: accepting hands over
// the group key, which is the strongest thing any actor in this system can be
// given.
//
// A client MUST NOT send this until the user has confirmed a dialog naming the
// offered device and showing a fingerprint of its public key (SPEC §3.3 step 2
// applies here, normatively): in this direction the risk sits with the member,
// who admits a device rather than merely failing to join one.
message PairingOfferAcceptRequest {
  string offer_code = 1;

  // Echoed from the scanned code. The relay compares it with the stored offer
  // byte for byte and refuses a mismatch, so a member that wrapped to a
  // substituted key cannot complete the pairing.
  bytes device_public_key = 2;

  // The current group key wrapped to device_public_key at the group's current
  // epoch (/spec/crypto.md §4.2). The relay cannot unwrap it.
  bytes wrapped_group_key = 3;
}
