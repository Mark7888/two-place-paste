# Gradle and JVM
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX and Jetifier
android.useAndroidX=true

# The architectures a release build ships. Debug builds keep all four so an
# emulator on any host works.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# React Native's current architecture and JS engine. Hermes is what the crypto
# runs on, and the vector tests run the same code under Node.
newArchEnabled=true
hermesEnabled=true

# Draw behind the status and navigation bars, and let the app inset its own
# content (src/app/App.tsx).
#
# This is stated rather than inherited. Android 15 enforces edge-to-edge for
# anything targeting SDK 35 or later and this app targets 36, so on a recent
# device the window is edge-to-edge whatever this property says; setting it
# true makes Android 12, 13 and 14 behave the same way instead of leaving the
# app laid out below the bars on some versions and behind them on others.
# Either way the insets are read from the platform, so there is no version
# where the padding is guessed.
edgeToEdgeEnabled=true

# Opt out of the built-in Kotlin support and the new DSL that ship with AGP 9,
# exactly as React Native 0.87's own app template does.
#
# Without the first, applying org.jetbrains.kotlin.android fails with "Cannot
# add extension with name 'kotlin'" — AGP 9 has already registered it. Without
# the second, the DSL this build file is written in is gone and AGP reports
# that the app "does not specify compileSdk". These are React Native's opt-outs
# to drop, not this app's: when React Native's template stops setting them,
# this file follows.
android.builtInKotlin=false
android.newDsl=false
