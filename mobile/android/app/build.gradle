apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // The JS entry point and the autolinking config live where the CLI expects
    // them; everything else is the plugin's default.
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    autolinkLibrariesWithApp()

    // A debug build expects Metro to serve the JavaScript, so React Native
    // skips bundling it: every variant named in `debuggableVariants` — by
    // default `debug` and `debugOptimized` — is built without an
    // `index.android.bundle`. That is what makes fast refresh possible, and it
    // is also why such an APK cannot start on its own.
    //
    // `-PbundleInDebug=true` empties that list, so the debug APK carries its
    // own bundle and runs with no dev server. CI builds with it, because an
    // artefact someone installs to test the tile on a device has to start; a
    // developer building locally does not pass it and keeps fast refresh.
    if (Boolean.parseBoolean(project.findProperty("bundleInDebug")?.toString() ?: "false")) {
        debuggableVariants = []
    }
}

// The release keystore (docs/plans/versioning-releases-and-updates.md §1.4).
// CI decodes it from the ANDROID_KEYSTORE_B64 secret into a file and points
// TPP_ANDROID_KEYSTORE at it. Every build an update can install over has to
// carry this one signature — Android refuses an APK signed by a different key
// — so it must never be regenerated. Absent (a fork, a local build), the
// release variant is unsigned and CI builds the debug variant instead.
def releaseKeystore = System.getenv("TPP_ANDROID_KEYSTORE")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.twoplacepaste"

    defaultConfig {
        applicationId "com.twoplacepaste"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        // CI passes both (-PversionCode=… -PversionName=…) from
        // scripts/version.sh: the code is the build's stamp, so a later build
        // always installs over an earlier one. A local build keeps these.
        versionCode((project.findProperty("versionCode") ?: "1").toString().toInteger())
        versionName((project.findProperty("versionName") ?: "0.0.0-local").toString())
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storeType "pkcs12"
                storePassword System.getenv("TPP_ANDROID_KEYSTORE_PASSWORD")
                // Not a secret, and kept out of secrets on purpose: Actions masks a
                // secret's value everywhere in the logs, and this one is the app's name.
                keyAlias "twoplacepaste"
                // A PKCS#12 store has one password, for the store and its key.
                keyPassword System.getenv("TPP_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // No signingConfig block: the Android Gradle Plugin generates and
            // uses the standard debug keystore, so this repository ships no
            // key material and no binary blob.
            applicationIdSuffix ".debug"
        }
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            // react-native-keychain and the camera library each bring a copy.
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.core:core-ktx:1.15.0")
}
