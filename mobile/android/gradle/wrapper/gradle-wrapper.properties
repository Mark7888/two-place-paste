# The Gradle distribution this project builds with.
#
# The wrapper JAR and the `gradlew` scripts are deliberately not committed: the
# JAR is a binary blob, and this repository has the property of containing
# none. Run `gradle wrapper` once in this directory to materialise them from
# the version pinned here; CI does the same before it builds.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
