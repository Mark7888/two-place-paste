{{define "content"}}
<h1>Sign in</h1>
<p class="lede">The admin password is set in the relay&rsquo;s configuration.</p>

<form method="post" action="/admin/login" class="card narrow">
  <div class="field">
    <label for="password">Admin password</label>
    <div class="with-affix">
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
      <!-- Hidden until app.js claims it: a toggle that cannot toggle is worse
           than no toggle at all. -->
      <button type="button" class="affix" data-reveal="password" aria-pressed="false" aria-label="Show the password" hidden>Show</button>
    </div>
  </div>
  <div><button type="submit">Sign in</button></div>
</form>
{{end}}
