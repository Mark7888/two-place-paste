# Desktop packaging: UI build → embed → binary build.
#
# The desktop job ROADMAP P6 owns. The Go and Node workflows already compile
# and test this module; what happens here is the part that only makes sense on
# the target operating systems — a .app for each Mac architecture and a plain
# .exe for Windows, each built around a binary with the React UI embedded in it. No
# installers are produced here; the .app and .exe are uploaded as artifacts
# as-is.
#
# Signing is deliberately conditional. A fork and a pull request have no
# certificate, and a workflow that fails without one is a workflow nobody can
# run; when the secrets are present the same job signs, and when they are not
# it says so and ships an unsigned artefact.
name: Desktop

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/**"
      - "pkg/tppclient/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "pkg/tppclient/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto

jobs:
  # One version for the whole run, computed once so every platform's build of
  # it carries the same one (docs/plans/versioning-releases-and-updates.md §1).
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
      stamp: ${{ steps.version.outputs.stamp }}
      channel: ${{ steps.version.outputs.channel }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      # The whole history and every tag: the version is derived from the
      # newest vX.Y.Z tag reachable from this commit.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute the version
        id: version
        run: scripts/version.sh
        env:
          TPP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # A pull_request run builds a merge commit; the build is named after
          # the PR's head commit, which is what the updater looks it up by.
          TPP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  package:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC: ${{ needs.version.outputs.numeric }}
      STAMP: ${{ needs.version.outputs.stamp }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      COMMIT: ${{ needs.version.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        # `name` is also the platform part of every file name this job
        # produces (TwoPlacePaste-<name>.zip / .exe), and the updater picks
        # the file for its own OS and architecture by it.
        include:
          # Two separate .app bundles rather than one universal one. Both are
          # built on the Apple Silicon runner: arm64 natively, x86_64 by
          # pointing cgo's clang at the other architecture.
          - os: macos-latest
            name: macOS-arm64
            goarch: arm64
            arch: arm64
          - os: macos-latest
            name: macOS-x64
            goarch: amd64
            arch: x86_64
          - os: windows-latest
            name: Windows-x64
            goarch: amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # The UI builds into desktop/internal/localui/dist, which the Go package
      # embeds. Order matters: a Go build before this one produces a binary
      # that serves the "UI not built" page.
      - name: Build the UI
        working-directory: desktop/ui
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Check the UI was embedded
        shell: bash
        run: test -f desktop/internal/localui/dist/index.html

      # The committed .syso files carry a placeholder version (winres/README.md).
      # Regenerated here so Explorer's Details tab shows this build's version.
      # The fixed file version is four 16-bit numbers, so it gets X.Y.Z.0; the
      # full version, pre-release and commit included, goes in the string.
      - name: Stamp the version into the Windows resources
        if: runner.os == 'Windows'
        working-directory: desktop/cmd/tppdesktop
        shell: bash
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64,arm64 \
            --product-version "$VERSION" --file-version "$NUMERIC.0"

      # -H=windowsgui on Windows, and only there: without it the linker marks
      # the binary as a console application and Windows opens a black console
      # window behind the tray icon for as long as the service runs. A GUI
      # subsystem process has no usable stderr, which is why the service also
      # logs to a file beside its settings (cmd/tppdesktop: newLogger).
      # On macOS cgo is on (the pasteboard change counter is Objective-C), so a
      # cross-build needs a C compiler for the target too: clang -arch does it.
      # The deployment target matches LSMinimumSystemVersion in Info.plist.
      - name: Build the binary
        working-directory: desktop
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ runner.os == 'macOS' && '1' || '' }}
          CC: ${{ runner.os == 'macOS' && format('clang -arch {0}', matrix.arch) || '' }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          mkdir -p ../dist
          BI=github.com/Mark7888/two-place-paste/desktop/internal/buildinfo
          LDFLAGS="-s -w -X $BI.Version=$VERSION -X $BI.Channel=$CHANNEL -X $BI.Commit=$COMMIT -X $BI.Stamp=$STAMP"
          if [ "${{ runner.os }}" = "Windows" ]; then
            LDFLAGS="$LDFLAGS -H=windowsgui"
          fi
          go build -trimpath -ldflags "$LDFLAGS" -o "../dist/tppdesktop${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/tppdesktop

      # ----------------------------------------------------------------- macOS
      # A cross-build that silently produced the runner's own architecture
      # would install and run on the wrong Macs only, so it is checked here.
      - name: Check the architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archs=$(lipo -archs dist/tppdesktop)
          echo "dist/tppdesktop: $archs"
          [ "$archs" = "${{ matrix.arch }}" ] || { echo "::error::built $archs, want ${{ matrix.arch }}"; exit 1; }

      - name: Build the .app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/TwoPlacePaste.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp desktop/packaging/macos/Info.plist "$APP/Contents/Info.plist"
          # Apple wants one to three integers in both: X.Y.Z for people, the
          # stamp for the build number.
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $NUMERIC" \
            -c "Set :CFBundleVersion $STAMP" \
            "$APP/Contents/Info.plist"
          cp desktop/packaging/macos/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp dist/tppdesktop "$APP/Contents/MacOS/tppdesktop"
          chmod +x "$APP/Contents/MacOS/tppdesktop"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --force --deep --options runtime --sign "$MACOS_SIGN_IDENTITY" "$APP"
          else
            echo "::notice::no signing identity configured; shipping an unsigned .app"
            codesign --force --deep --sign - "$APP" || true
          fi
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}

      # Zipped here rather than by upload-artifact, which uploads a directory's
      # *contents* and so loses the .app wrapper: what came down was a folder
      # of Contents/… with no bundle to double-click, which is why the only
      # runnable thing in it looked like a bare executable in MacOS/.
      #
      # `ditto -c -k --keepParent` is the tool Apple ships for this. `zip`
      # would do it too, but ditto is the one that preserves the symlinks and
      # the executable bits a bundle needs, and it is what notarisation
      # expects later (ROADMAP P8).
      - name: Zip the .app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/TwoPlacePaste.app "dist/TwoPlacePaste-${{ matrix.name }}.zip"
          # Prove the wrapper survived, because this is exactly what broke.
          unzip -l "dist/TwoPlacePaste-${{ matrix.name }}.zip" | grep -q "TwoPlacePaste.app/Contents/MacOS/tppdesktop"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: tppdesktop-${{ matrix.name }}-${{ needs.version.outputs.version }}
          if-no-files-found: error
          # The zip, not the directory: an artifact upload of the .app itself
          # arrives unwrapped.
          path: dist/TwoPlacePaste-${{ matrix.name }}.zip

      # Named for what it is rather than what it is called once installed: the
      # updater and the installer both put it in place as tppdesktop.exe.
      - name: Name the .exe
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/tppdesktop.exe "dist/TwoPlacePaste-${{ matrix.name }}.exe"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: tppdesktop-${{ matrix.name }}-${{ needs.version.outputs.version }}
          if-no-files-found: error
          path: dist/TwoPlacePaste-${{ matrix.name }}.exe

  # One manifest for every desktop file of this run, signed with the
  # update-signing key (docs/plans/versioning-releases-and-updates.md §3.6).
  # The updater installs nothing whose checksum is not in a manifest that
  # verifies against the public key compiled into it. A fork's pull request
  # has no key, so its manifest is unsigned and the updater treats the build
  # as unsigned.
  manifest:
    name: Manifest
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: tppdesktop-*
          path: dist
          merge-multiple: true

      - name: Write and sign the manifest
        run: scripts/manifest.sh desktop dist/manifest dist/TwoPlacePaste-*
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NUMERIC: ${{ needs.version.outputs.numeric }}
          STAMP: ${{ needs.version.outputs.stamp }}
          CHANNEL: ${{ needs.version.outputs.channel }}
          COMMIT: ${{ needs.version.outputs.commit }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: tppdesktop-manifest-${{ needs.version.outputs.version }}
          path: dist/manifest/
          if-no-files-found: error
