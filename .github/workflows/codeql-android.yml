# CodeQL code scanning for Java/Kotlin (the Android app), as an advanced setup.
#
# This replaces GitHub's default setup, which turned Java/Kotlin on as soon as
# the Android app had Kotlin sources and then failed on every run: Kotlin must
# be compiled to be analysed, and default setup's autobuild only looks for a
# Gradle, Maven or Ant project at the repository root. Ours lives in
# mobile/android, has no committed wrapper and cannot configure before the
# JavaScript dependencies are installed (see android.yml), so this workflow
# builds it by hand, mirroring android.yml.
#
# Each CodeQL language has its own workflow so that it can be path-gated on
# the files it actually analyses; this one is the slow one, and only the
# native project and the npm packages it autolinks can change what it
# compiles. A skipped run leaves the last analysis in place, which is still
# accurate because none of its files changed. The weekly schedule ignores
# path filters and re-analyses every language, so new CodeQL queries still
# reach code nobody has touched.
#
# The results category stays /language:java-kotlin, as it was when all
# languages shared one workflow, so existing alerts carry over.
#
# Default setup must be switched off in the repository settings for these
# results to be accepted; GitHub rejects advanced-setup uploads while it is on.
name: CodeQL (Java/Kotlin)

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/android/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/codeql-android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mobile/android/**"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - ".github/workflows/codeql-android.yml"
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # The same toolchain and steps as android.yml's APK job, which explains
      # each pin. Only compilation matters here, so it builds the plain debug
      # variant without bundling the JavaScript.
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install the SDK packages React Native pins
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install the JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Materialise the Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 9.4.1

      # --no-build-cache makes sure every Kotlin and Java source is actually
      # compiled while CodeQL watches: a task restored from a cache would be
      # skipped and its files left out of the database.
      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon --no-build-cache assembleDebug

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
