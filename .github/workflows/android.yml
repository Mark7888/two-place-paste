# The Android app's build (ROADMAP P7).
#
# The Node workflow already lints, typechecks and tests /mobile — that is the
# JavaScript half, and it runs on every Node change. This job is the half that
# only exists on Android: Kotlin compiles, the manifest resolves, the tile
# service and the two native modules are real classes, and the whole thing
# packages into an APK that can be installed.
#
# With the release keystore (a repository secret) it builds the signed release
# APK that updates install over; without it, as on a fork's pull request, the
# debug APK it always built (docs/plans/versioning-releases-and-updates.md §1.4).
name: Android

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The same computation desktop.yml makes (docs/plans/versioning-releases-and-updates.md §1).
  # The stamp is the APK's versionCode, so a later build always installs over
  # an earlier one.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stamp: ${{ steps.version.outputs.stamp }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute the version
        id: version
        run: scripts/version.sh
        env:
          TPP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TPP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  build:
    name: APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.87's own Gradle plugin builds against a Java 17
      # toolchain, so 17 is what the build needs — not the newest JDK.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # `packages` is pinned to override the action's default of
      # "tools platform-tools". The obsolete `tools` package has been removed
      # from Google's repository, so that default now fails the action with
      # "Failed to find package 'tools'" — it stopped working between one run
      # of this workflow and the next, with nothing changed here.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # The SDK packages React Native 0.87 pins, installed explicitly so that a
      # missing one is a named step that failed rather than a puzzle inside
      # Gradle.
      #
      # The platform id is "android-37.0", not "android-37": Android now
      # versions platforms with a minor component, and `compileSdk 37` in the
      # build file resolves to the .0 of that API. The runner image already
      # carries the platform and the build tools, so those two lines are
      # usually a no-op that costs nothing and stops the build from depending
      # on what a runner image happens to ship. The NDK is the one real
      # download: the runner has 27.3, React Native pins 27.1.
      - name: Install the SDK packages React Native pins
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      # Autolinking reads node_modules, so the JavaScript dependencies have to
      # be installed before Gradle configures anything.
      - name: Install the JavaScript dependencies
        working-directory: mobile
        run: npm ci

      # Pinned, and pinned to React Native 0.87's own Gradle version. Without
      # this the runner's preinstalled Gradle is used, and a newer one ships a
      # Kotlin stdlib whose metadata React Native's plugin — built with Kotlin
      # 2.2.0 — cannot read, which fails the build inside node_modules before
      # any of this app is compiled.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      # The wrapper JAR is not committed (see mobile/.gitignore): this
      # materialises it from the pinned distribution, so the build uses exactly
      # the Gradle version the repository states.
      - name: Materialise the Gradle wrapper
        working-directory: mobile/android
        run: gradle wrapper --gradle-version 9.4.1

      # The release keystore comes from secrets, which only a run in this
      # repository has. With it the job builds the signed release APK that
      # updates install over; without it (a fork's pull request) it falls back
      # to the debug build it always made, which installs as the separate
      # com.twoplacepaste.debug app and never as an update of the real one.
      - name: Decode the release keystore
        id: keystore
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::notice::no release keystore available; building the debug APK"
            echo "signed=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d >"$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >>"$GITHUB_OUTPUT"
          echo "signed=true" >>"$GITHUB_OUTPUT"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build the signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
        env:
          VERSION_CODE: ${{ needs.version.outputs.stamp }}
          VERSION_NAME: ${{ needs.version.outputs.version }}
          TPP_ANDROID_KEYSTORE: ${{ steps.keystore.outputs.path }}
          TPP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TPP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # -PbundleInDebug=true makes the debug variant carry its own JS bundle
      # (see mobile/android/app/build.gradle). Without it React Native leaves
      # the bundle out of a debug build and the APK cannot start without a
      # Metro dev server, which is no use to someone installing it to test the
      # tile on a device.
      - name: Build the debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug -PbundleInDebug=true \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
        env:
          VERSION_CODE: ${{ needs.version.outputs.stamp }}
          VERSION_NAME: ${{ needs.version.outputs.version }}

      # One name per kind, so a debug-signed APK can never be mistaken for, or
      # published as, the release-signed one.
      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            src=mobile/android/app/build/outputs/apk/release/app-release.apk
            name=TwoPlacePaste-android.apk
          else
            src=mobile/android/app/build/outputs/apk/debug/app-debug.apk
            name=TwoPlacePaste-android-debug.apk
          fi
          cp "$src" "dist/$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      # The bundle is the thing that makes this artefact installable, and its
      # absence is invisible until the app is launched on a device. So it is
      # asserted here rather than discovered there.
      - name: Check the APK carries its own JS bundle
        run: |
          set -euo pipefail
          apk="dist/${{ steps.apk.outputs.name }}"
          if ! unzip -l "$apk" | grep -q "assets/index.android.bundle"; then
            echo "::error::$apk has no assets/index.android.bundle; it would ask for a Metro server on launch"
            exit 1
          fi
          echo "$apk carries assets/index.android.bundle"

      # Proves the secret held the key it should: the certificate printed here
      # is the one every future update must match. It is public information.
      - name: Check the release signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/${{ steps.apk.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: twoplacepaste-${{ steps.keystore.outputs.signed == 'true' && 'android' || 'android-debug' }}-${{ needs.version.outputs.version }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error
