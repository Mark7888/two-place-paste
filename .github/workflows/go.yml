# Go CI: build, vet, lint and test each module independently.
#
# Path-gated so that a mobile-only change does not run Go jobs
# (ROADMAP P0 deliverables). The two React UIs (desktop/ui, server/ui) are
# Node's: the Go modules embed their builds but compile and test without them,
# and node.yml checks them.
name: Go

on:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - "!server/ui/**"
      - "pkg/**"
      - "desktop/**"
      - "!desktop/ui/**"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "server/**"
      - "!server/ui/**"
      - "pkg/**"
      - "desktop/**"
      - "!desktop/ui/**"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".github/workflows/go.yml"
  workflow_dispatch:

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Every go.mod declares go 1.26; `auto` lets the runner fetch that toolchain
  # if the preinstalled one is older.
  GOTOOLCHAIN: auto
  GOLANGCI_LINT_VERSION: v2.6.2

jobs:
  build:
    name: ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        module: [server, pkg/tppclient, desktop]
        os: [ubuntu-latest]
        include:
          # The desktop service has per-OS clipboard and tray code (P5b), so it
          # must compile on its target platforms too.
          - module: desktop
            os: macos-latest
          - module: desktop
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # No cache-dependency-path: an explicit path that does not resolve is
          # a hard error, and the modules have no go.sum until Phase 3a adds the
          # first dependency. The default glob warns and continues instead.

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::unformatted files:"; echo "$out"; exit 1
          fi

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # The server's integration tests run against a real Redis and a real
      # S3-compatible store. Started as plain containers rather than job
      # services because services exist only on Linux runners and this job's
      # matrix also runs on macOS and Windows. A test whose store is missing
      # skips with a reason (docs/internal/conventions.md §5), so a failed pull costs
      # coverage, not the build.
      - name: Start Redis and MinIO
        if: matrix.module == 'server' && runner.os == 'Linux'
        continue-on-error: true
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      # Built from source with the same Go the modules target: a prebuilt
      # golangci-lint compiled against an older Go refuses to analyse them.
      - name: Cache golangci-lint
        id: cache-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('server/go.mod') }}-${{ runner.os }}

      - name: Install golangci-lint
        if: steps.cache-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          for m in server pkg/tppclient desktop; do
            echo "::group::$m"
            (cd "$m" && golangci-lint run ./...)
            echo "::endgroup::"
          done
