# Redis configuration for TwoPlacePaste (SPEC §4.2).
#
# Redis is the only datastore and it holds two zones with different rules:
#
#   persistent   groups, devices, public keys, wrapped group keys, epochs,
#                creation tokens. No TTL. Losing one of these destroys a group
#                permanently: nobody can re-issue a wrapped key the server
#                never had in the clear.
#   ephemeral    clipboard entries and inline blobs, 24h TTL.
#
# Both live in one keyspace, which is what makes the two settings below
# load-bearing rather than tuning.

# AOF: the persistent zone must survive a restart. RDB snapshots alone would
# lose every group created since the last save.
appendonly yes
appendfsync everysec

# volatile-lru evicts only keys that carry a TTL — that is, only the ephemeral
# zone. Do NOT change this to allkeys-lru: under memory pressure Redis would
# then be free to evict a group record, a device record or a wrapped key, and
# the group is unrecoverable. It would also silently destroy pairings mid-flow.
maxmemory-policy volatile-lru

# Cap memory so the policy above has something to act on. Size it for the
# ephemeral zone: entries are capped at 10 MB of ciphertext each and only the
# ones at or below 256 KB are stored inline (SPEC §4.3).
maxmemory 512mb

# The server reaches Redis over the compose network only; nothing publishes
# this port to the host.
protected-mode no
