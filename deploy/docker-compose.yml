# TwoPlacePaste deployment: one Go server, one Redis (SPEC §4.1), and
# optionally MinIO for blob storage.
#
#   cp .env.example .env    # then edit it
#   docker compose up -d --build
#
# With MinIO (set the S3 block in .env first — see .env.example):
#
#   docker compose --profile minio up -d --build
#
# Build context is the repository root because the Go workspace spans three
# modules; run compose from this directory and it resolves.
#
# TLS is NOT terminated here. Put a reverse proxy in front of the published
# port — see docs/deployment.md.

name: tpp

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The config file carries the two settings this deployment cannot do
    # without: AOF persistence and maxmemory-policy volatile-lru. See
    # redis.conf — allkeys-lru would silently evict group records and destroy
    # pairings (SPEC §4.2).
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    # No ports: Redis is reachable only on the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides anything in .env: inside the compose network Redis is
      # "redis", and the blob root is where the volume below is mounted.
      TPP_REDIS_ADDR: redis:6379
      TPP_BLOB_ROOT: /var/lib/tpp/blobs
      TPP_HTTP_ADDR: ":8080"
    ports:
      # Bound to loopback by default: the reverse proxy is the only thing that
      # should reach this, and the server speaks plain HTTP (SPEC §4.1).
      #
      # TPP_HOST_BIND_ADDR moves that binding for a deployment whose proxy is
      # not on this host's loopback — a second machine on a private network, or
      # a host with several addresses where the proxy reaches only one of them.
      # Setting it to an address the internet can reach publishes an
      # unencrypted HTTP port, so set it to the interface the proxy uses and
      # nothing wider. "0.0.0.0" is every interface, which is that mistake by
      # another name.
      - "${TPP_HOST_BIND_ADDR:-127.0.0.1}:${TPP_HOST_PORT:-8080}:8080"
    volumes:
      - blob-data:/var/lib/tpp/blobs
    # The image's own USER; restated here so it survives an image change.
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
      # Only when the minio profile is enabled; otherwise ignored.
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional S3-compatible blob storage, enabled with --profile minio. The
  # server reaches it as http://minio:9000 on the compose network; nothing is
  # published, because clients never talk to it — every byte goes through the
  # relay.
  #
  # Its root credentials are the server's S3 credentials from .env, so one
  # pair configures both sides, and TPP_S3_CREATE_BUCKET=true lets the server
  # create its bucket on first start. The secret must be at least 8 characters.
  minio:
    profiles: ["minio"]
    image: ${TPP_MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${TPP_S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${TPP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - minio-data:/data
    # To reach the web console from this host, uncomment and add
    # `--console-address :9001` to the command above:
    # ports:
    #   - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Named, not bind-mounted: all of them survive `docker compose down` and are
  # what a backup copies (docs/deployment.md).
  redis-data:
  blob-data:
  minio-data:
