# TwoPlacePaste deployment: one Go server, one Redis (SPEC §4.1).
#
#   cp .env.example .env    # then edit it
#   docker compose up -d --build
#
# Build context is the repository root because the Go workspace spans three
# modules; run compose from this directory and it resolves.
#
# TLS is NOT terminated here. Put a reverse proxy in front of the published
# port — see docs/deployment.md.

name: tpp

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The config file carries the two settings this deployment cannot do
    # without: AOF persistence and maxmemory-policy volatile-lru. See
    # redis.conf — allkeys-lru would silently evict group records and destroy
    # pairings (SPEC §4.2).
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    # No ports: Redis is reachable only on the compose network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides anything in .env: inside the compose network Redis is
      # "redis", and the blob root is where the volume below is mounted.
      TPP_REDIS_ADDR: redis:6379
      TPP_BLOB_ROOT: /var/lib/tpp/blobs
      TPP_HTTP_ADDR: ":8080"
    ports:
      # Bound to loopback: the reverse proxy is the only thing that should
      # reach this, and the server speaks plain HTTP (SPEC §4.1).
      - "127.0.0.1:${TPP_HOST_PORT:-8080}:8080"
    volumes:
      - blob-data:/var/lib/tpp/blobs
    # The image's own USER; restated here so it survives an image change.
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  # Named, not bind-mounted: both survive `docker compose down` and are what a
  # backup copies (docs/deployment.md).
  redis-data:
  blob-data:
